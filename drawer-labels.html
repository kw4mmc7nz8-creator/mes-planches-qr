<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Étiquettes de tiroirs — MonCongélo</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f4f6;color:#111;margin:0;padding:16px}.wrap{max-width:780px;margin:auto}.controls{margin:0 0 18px}.controls h1{font-size:26px;margin:12px 0 18px}.back-button{display:inline-block;padding:10px 15px;border-radius:10px;background:#fff;color:#123c67;text-decoration:none;border:1px solid #c9dbe9;font-weight:650}.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:14px 16px;font-weight:650;font-size:16px;display:block;margin:20px 0 10px}.sheet{background:#fff;margin:15px 0;box-shadow:0 2px 14px #0001;width:100%}.strip{height:49.5mm;box-sizing:border-box;border-bottom:1px dashed #777;display:flex;align-items:center;gap:16px;padding:4mm}.qr{width:26.6mm;height:26.6mm;flex:none}.qr canvas,.qr img{width:100%!important;height:100%!important}.number{font-size:24px;font-weight:800;overflow-wrap:anywhere;align-self:center}.custom{display:none}#status{line-height:1.4;margin:16px 0;color:#222}@page{size:A4 portrait;margin:0}@media print{body{padding:0;background:#fff}.controls{display:none}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none;break-after:page}.sheet:last-child{break-after:auto}}</style><script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script></head><body><div class="wrap"><div class="controls"><h1>Étiquettes des tiroirs</h1><a class="back-button" href="index.html">‹ Retour</a><p id="status">Six étiquettes par page A4, prêtes à imprimer sur papier autocollant.</p><button class="btn" id="make">Générer la planche de QR CODES</button></div><div id="sheets"></div></div><script>
(()=>{const data=JSON.parse(sessionStorage.getItem('moncongelo-drawer-labels')||'[]');const root=document.getElementById('sheets');if(!data.length){document.getElementById('status').textContent='Aucune étiquette à générer. Retournez à l’accueil.';return}data.forEach((d,i)=>{if(i%6===0){const sheet=document.createElement('div');sheet.className='sheet';root.append(sheet)}const strip=document.createElement('div');strip.className='strip';const qr=document.createElement('div');qr.className='qr';const number=document.createElement('div');number.className='number';number.textContent='TIROIR N° '+d.number+(d.name?' - '+d.name:'');const custom=document.createElement('div');custom.className='custom';custom.textContent='';strip.append(qr,number,custom);root.lastElementChild.append(strip);if(window.QRCode)new QRCode(qr,{text:'MC-TIROIR:'+d.number+':'+encodeURIComponent(d.name||''),width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})});document.getElementById('make').onclick=()=>{try{if(!window.jspdf?.jsPDF||!window.QRCode)throw Error('Bibliothèques PDF ou QR indisponibles : vérifiez la connexion Internet.');const pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const strips=[...document.querySelectorAll('.strip')];for(let i=0;i<strips.length;i++){if(i===6)pdf.addPage();const d=data[i],y=(i%6)*49.5;pdf.setDrawColor(120);pdf.setLineDashPattern([1,1],0);pdf.line(0,y+49.5,210,y+49.5);pdf.setLineDashPattern([],0);const qr=strips[i].querySelector('canvas'),img=strips[i].querySelector('img');const url=qr?.toDataURL('image/png')||img?.src;if(!url)throw Error('QR code non généré');pdf.addImage(url,'PNG',10.7,y+11.45,26.6,26.6);pdf.setFont('helvetica','bold');pdf.setFontSize(20);const label='TIROIR N° '+d.number+(d.name?' - '+d.name:'');pdf.setFontSize(18);const lines=pdf.splitTextToSize(label,155).slice(0,3);const lineH=7.5;pdf.text(lines,43,y+24.75-(lines.length-1)*lineH/2,{baseline:'middle'})}const blob=pdf.output('blob');const url=URL.createObjectURL(blob);document.getElementById('status').textContent='PDF prêt. Utilisez Partager puis Imprimer.';location.href=url}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}}})();
</script></body></html>
