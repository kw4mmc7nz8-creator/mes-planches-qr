<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Étiquettes de tiroirs — MonCongélo</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f8fb;color:#183047;margin:0;padding:18px}.wrap{max-width:750px;margin:auto}.btn{background:#167ac2;color:white;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:16px}.sheet{background:white;margin:15px 0;box-shadow:0 1px 8px #0002}.strip{height:49.5mm;box-sizing:border-box;border-bottom:1px dashed #777;display:flex;align-items:center;gap:16px;padding:4mm}.qr{width:38mm;height:38mm;flex:none}.qr canvas,.qr img{width:100%!important;height:100%!important}.number{font-size:22px;font-weight:800;min-width:120px}.custom{font-size:19px;font-weight:650;overflow-wrap:anywhere}#status{color:#64748b}@media print{@page{size:A4 portrait;margin:0}body{padding:0;background:white}.controls{display:none}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none;break-after:page}.sheet:last-child{break-after:auto}}</style><script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script></head><body><div class="wrap"><div class="controls"><h2>Étiquettes des tiroirs</h2><button class="btn" id="make">GÉNÉRER PDF A4</button> <button class="btn" onclick="location.href='index.html'">ACCUEIL</button><p id="status">Six étiquettes par page A4, prêtes à imprimer sur papier autocollant.</p></div><div id="sheets"></div></div><script>
(()=>{const data=JSON.parse(sessionStorage.getItem('moncongelo-drawer-labels')||'[]');const root=document.getElementById('sheets');if(!data.length){document.getElementById('status').textContent='Aucune étiquette à générer. Retournez à l’accueil.';return}data.forEach((d,i)=>{if(i%6===0){const sheet=document.createElement('div');sheet.className='sheet';root.append(sheet)}const strip=document.createElement('div');strip.className='strip';const qr=document.createElement('div');qr.className='qr';const number=document.createElement('div');number.className='number';number.textContent='TIROIR N° '+d.number;const custom=document.createElement('div');custom.className='custom';custom.textContent=d.name||'';strip.append(qr,number,custom);root.lastElementChild.append(strip);if(window.QRCode)new QRCode(qr,{text:'MC-TIROIR:'+d.number+':'+encodeURIComponent(d.name||''),width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})});document.getElementById('make').onclick=()=>{try{if(!window.jspdf?.jsPDF||!window.QRCode)throw Error('Bibliothèques PDF ou QR indisponibles : vérifiez la connexion Internet.');const pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const strips=[...document.querySelectorAll('.strip')];for(let i=0;i<strips.length;i++){if(i===6)pdf.addPage();const d=data[i],y=(i%6)*49.5;pdf.setDrawColor(120);pdf.setLineDashPattern([1,1],0);pdf.line(0,y+49.5,210,y+49.5);pdf.setLineDashPattern([],0);const qr=strips[i].querySelector('canvas'),img=strips[i].querySelector('img');const url=qr?.toDataURL('image/png')||img?.src;if(!url)throw Error('QR code non généré');pdf.addImage(url,'PNG',5,y+5.5,38,38);pdf.setFont('helvetica','bold');pdf.setFontSize(20);pdf.text('TIROIR N° '+d.number,51,y+26);if(d.name){pdf.setFontSize(15);const name=pdf.splitTextToSize(d.name,69);pdf.text(name.slice(0,3),135,y+22)}}const blob=pdf.output('blob');const url=URL.createObjectURL(blob);document.getElementById('status').textContent='PDF prêt. Utilisez Partager puis Imprimer.';location.href=url}catch(e){document.getElementById('status').textContent='Erreur : '+e.message}}})();
</script></body></html>
